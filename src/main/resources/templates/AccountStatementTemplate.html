<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Statement Recreation</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
        }

        .page {
            width: 100%;
            padding: 30px 40px;
            background: #fff;
        }

        .header-container {
            width: 100%;
            display: table;
            margin-bottom: 40px;
        }

        .bank-header {
            display: table-cell;
            width: 50%;
            vertical-align: top;
        }

        .bank-line img {
            max-height: 50px;
            width: auto;
        }

        .bank-details {
            font-size: 13px;
            color: #555;
            margin-top: 8px;
            line-height: 1.4;
        }

        .statement {
            display: table-cell;
            width: 50%;
            vertical-align: top;
            text-align: right;
        }

        .statement h1 {
            margin: 0 0 15px;
            font-size: 28px;
            font-weight: 300;
            color: #e8bd19;
        }

        .srow {
            display: block;
            border-bottom: 4px solid #e8bd19;
            padding-bottom: 6px;
            margin-bottom: 8px;
            font-size: 15px;
            text-align: right;
        }

        .srow strong {
            float: left;
            font-size: 15px;
        }

        .content {
            width: 100%;
            clear: both;
        }

        .name {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .name strong {
            margin-right: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 14px;
        }

        th {
            text-align: left;
            border-bottom: 4px solid #e8bd19;
            padding: 0 5px 6px;
            font-weight: 700;
        }

        th.num,
        td.num {
            text-align: right;
        }

        td {
            padding: 8px 5px;
            vertical-align: top;
            word-wrap: break-word;
        }

        tr {
            border-bottom: 3px solid #000000;
        }

        tr:last-child {
            border-bottom: 3px solid #777;
        }

        .desc {
            line-height: 1.15;
        }
    </style>
</head>
<body>
<div class="page">

    <div class="header-container">
        <div class="bank-header">
            <div class="bank-line">
                <img alt="ACME Bank Logo" src="src/main/resources/images/logo.png"/>
            </div>
            <div class="bank-details">
                Some Building, Financial District<br/>
                Regulated & Licensed by the National Banking Authority (Maybe)
            </div>
        </div>

        <div class="statement">
            <h1>Your Account Statement</h1>
            <div class="srow">
                <strong>Account Number</strong><span th:text="${account_number}"></span>
            </div>
            <div class="srow">
                <strong>Account Type</strong><span th:text="${account_type}"></span>
            </div>
            <div class="srow">
                <strong>Current Balance</strong><span>$<span th:text="${current_balance}"></span></span>
            </div>
        </div>
    </div>

    <main class="content">
        <div class="name"><strong>Name:</strong> <span th:text="${name}"></span></div>

        <table>
            <colgroup>
                <col style="width: 20%;"/>
                <col style="width: 45%;"/>
                <col style="width: 13%;"/>
                <col style="width: 13%;"/>
                <col style="width: 14%;"/>
            </colgroup>
            <thead>
            <tr>
                <th>Date</th>
                <th>Transaction Type</th>
                <th class="num">Debit</th>
                <th class="num">Credit</th>
                <th class="num">Balance</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tx : ${transactions}">
                <td th:text="${tx.date}"></td>
                <td class="desc" th:text="${tx.transactionType}"></td>
                <td class="num" th:text="${tx.debit}"></td>
                <td class="num" th:text="${tx.credit}"></td>
                <td class="num" th:text="${tx.balance}"></td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
</body>
</html>
